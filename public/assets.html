<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop OS — Business Assets</title><link rel="stylesheet" href="/static/css/base.css">
<style>
  /* Business Assets full-page browser. Ported in structure (category nav,
     search, doc-card grid, drag-and-drop upload, preview overlay) from
     Robonuggets/agentic-os/assets.html (258 lines), restyled onto this
     project's own light-theme token set (base.css's --bg/--fg/--muted/
     --accent/--card/--border) instead of the kit's separate dark-theme
     token block, so this page reads as the same product as login/users/
     employee.html rather than the kit's own visual language. */
  main#assets-root { padding: 0; max-width: 100%; }
  .assets-top { display: flex; align-items: center; gap: 10px; padding: 0.75rem 0.9rem; border-bottom: 1px solid var(--border); background: var(--card); }
  .assets-top input[type=search] { flex: 1; max-width: 420px; padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; }
  .btn { height: 34px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-weight: 600; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
  .assets-body { display: grid; grid-template-columns: 220px 1fr; align-items: start; }
  #assets-cats { border-right: 1px solid var(--border); padding: 14px 10px; position: sticky; top: 0; height: calc(100vh - 60px); overflow-y: auto; }
  #assets-cats .lbl { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin: 8px 8px 6px; }
  #assets-cats button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--fg); font-size: 13px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  #assets-cats button:hover { background: var(--bg); }
  #assets-cats button.on { background: var(--border); color: var(--accent); font-weight: 600; }
  #assets-cats button .n { margin-left: auto; font-size: 11px; color: var(--muted); }
  #assets-cats .star { color: #b68a2c; }
  #assets-root > section { padding: 18px 24px 48px; }
  .assets-sh { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .assets-sh h2 { font-size: 16px; margin: 0; }
  .assets-cnt { font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  .assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .doc { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .doc:hover { border-color: var(--accent); }
  .doc .top { display: flex; align-items: flex-start; gap: 10px; }
  .doc .ic { width: 32px; height: 38px; flex: 0 0 auto; border-radius: 4px; display: grid; place-items: center; font: 700 9px system-ui, sans-serif; letter-spacing: 1px; color: #fff; background: var(--accent); }
  .doc .ic.pdf { background: #c2461f; } .doc .ic.img { background: #2aa88a; } .doc .ic.xls { background: #15803d; }
  .doc .ic.doc { background: #1c6ea4; } .doc .ic.txt { background: #6a7788; }
  .doc .nm { font-size: 13px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .doc .cat { font-size: 10px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .doc .fav { margin-left: auto; flex: 0 0 auto; background: none; border: 0; cursor: pointer; font-size: 18px; line-height: 1; color: var(--border); }
  .doc .fav.on { color: #b68a2c; }
  .doc .meta { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
  .doc .acts { display: flex; gap: 6px; margin-top: auto; }
  .doc .acts .btn { height: 26px; padding: 0 9px; font-size: 10px; }
  .assets-empty { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; line-height: 1.7; }
  .assets-empty b { color: var(--fg); }

  #assets-drop { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; background: rgba(28,110,164,.12); border: 4px dashed var(--accent); pointer-events: none; }
  #assets-drop div { font-size: 14px; letter-spacing: 3px; color: var(--accent); font-weight: 700; background: var(--card); padding: 12px 20px; border-radius: 8px; }
  body.dragging #assets-drop { display: grid; }
  .ov { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: rgba(0,0,0,.4); }
  .ov:not([hidden]) { display: grid; }
  .pop { width: min(480px, 92vw); background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 20px 22px; }
  .pop h3 { font-size: 16px; margin: 0 0 6px; }
  .pop p { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin: 0 0 12px; }
  .pop select { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
  .pop .files { font-size: 12px; color: var(--fg); margin-bottom: 12px; max-height: 130px; overflow: auto; line-height: 1.6; }
  .pop .row { display: flex; gap: 8px; justify-content: flex-end; }
  #assets-preview-ov .pop { width: min(1000px, 94vw); height: min(86vh, 860px); display: flex; flex-direction: column; padding: 12px 14px; }
  #assets-preview-ov iframe { flex: 1; border: 0; background: #fff; border-radius: 6px; }
  #assets-preview-ov .row { margin-bottom: 8px; align-items: center; }
  #assets-preview-ov .row b { margin-right: auto; font-size: 13px; }
</style>
</head>
<body data-role="__ROLE__">
<header>
  <span class="brand" id="shop-name">Shop OS</span>
  <span id="who"></span>
  <a href="/owner">Dashboard</a>
  <button id="logout">Log out</button>
</header>
<main id="assets-root">
  <div class="assets-top">
    <input type="search" id="assets-q" placeholder="Search documents… (press / to focus)">
    <button class="btn solid" id="assets-upload-btn">Upload</button>
    <input type="file" id="assets-file-input" multiple hidden>
  </div>
  <div class="assets-body">
    <nav id="assets-cats"></nav>
    <section>
      <div class="assets-sh"><h2 id="assets-sec-title">All documents</h2><span class="assets-cnt" id="assets-sec-count"></span></div>
      <div class="assets-grid" id="assets-grid"></div>
      <div class="assets-empty" id="assets-empty" hidden></div>
    </section>
  </div>
</main>

<div id="assets-drop"><div>DROP TO UPLOAD</div></div>

<div class="ov" id="assets-upload-ov" hidden>
  <div class="pop">
    <h3>Add documents</h3>
    <p>Files are copied into the category's folder. Nothing is renamed or modified; a duplicate name gets a (2).</p>
    <select id="assets-upload-cat"></select>
    <div class="files" id="assets-upload-files"></div>
    <div class="row"><button class="btn" id="assets-upload-cancel" type="button">Cancel</button><button class="btn solid" id="assets-upload-go" type="button">Upload</button></div>
  </div>
</div>

<div class="ov" id="assets-preview-ov" hidden>
  <div class="pop">
    <div class="row"><b id="assets-preview-name"></b><a class="btn" id="assets-preview-open" target="_blank">Open in tab</a><a class="btn" id="assets-preview-dl">Download</a><button class="btn" id="assets-preview-close" type="button">Close</button></div>
    <iframe id="assets-preview-frame" title="preview"></iframe>
  </div>
</div>

<script type="module" src="/static/js/assets-page.js"></script>
<script type="module">
import { api } from "/static/js/api.js";
const me = await (await api("GET", "/api/me")).json();
document.getElementById("shop-name").textContent = me.shopName;
document.getElementById("who").textContent = me.user.displayName;
document.getElementById("logout").onclick = async () => { await api("POST", "/api/logout", {}); location.href = "/login"; };
</script>
</body></html>
